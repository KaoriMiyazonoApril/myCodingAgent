[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "my-coding-agent"
version = "0.1.0"
description = "An independently implemented local coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "openai>=1.0",
  "regex>=2024.0",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]
